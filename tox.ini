[tox]
envlist = {py310,py311,py312,py313}-django52
	{py312,py313}-django60
	{py312,py313}-django61

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313


[testenv]
# tox only forwards an allowlist of env vars into the test environment;
# the Django suite (runtests.py) reads the Celery broker from this one, so
# it must be passed through explicitly (DB host/port use settings defaults
# that already match the CI service).
passenv =
    DENORM_TEST_REDIS_URL
    DATABASE_*
    DJANGO_DB_*
commands =
    pip install coverage psycopg2
    python runtests.py postgres
    pytest tests/

deps =
    django52: Django>=5.2, <5.3
    django60: Django>=6.0, <6.1
    django61: Django>=6.1, <6.2
    psycopg2
    celery
    celery_singleton
    coverage
    pytest
    pytest-django
    pytest-timeout
